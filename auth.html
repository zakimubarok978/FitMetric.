<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="FitMetric | Login & Register">FitMetric | Login & Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
  </head>
  <body>
    <main class="auth-shell">
      <div class="auth-layout">
        <section class="auth-visual" aria-label="Auth introduction" data-i18n-aria-label="Auth introduction">
          <div class="auth-visual-inner">
            <div class="auth-badge"><i data-lucide="sparkles"></i> FitMetric</div>
            <h2 data-i18n="Track smarter. Train harder. Level up.">Track smarter. Train harder. Level up.</h2>
            <p data-i18n="Build a stronger routine with personalized training insights, measurable milestones, and daily accountability.">Build a stronger routine with personalized training insights, measurable milestones, and daily accountability.</p>
          </div>
        </section>

        <section class="auth-panel">
          <div class="auth-card">
            <div class="auth-topbar">
              <a href="index.html" class="brand" aria-label="Back to home" data-i18n-aria-label="Back to home">
                <span class="brand-mark"><i data-lucide="dumbbell"></i></span>
                <span>FitMetric</span>
              </a>
              <div class="auth-controls">
                <div class="language-switcher">
                  <button type="button" class="language-trigger" aria-expanded="false" aria-label="Change language" data-i18n-aria-label="Change language">
                    <i data-lucide="globe-2"></i><span data-language-label>Bahasa: Indonesia</span><i data-lucide="chevron-down"></i>
                  </button>
                  <div class="language-menu">
                    <button type="button" data-language-option="id">🇮🇩 Bahasa Indonesia</button>
                    <button type="button" data-language-option="en">🇬🇧 English</button>
                  </div>
                </div>
                <div class="auth-toggle" role="tablist" aria-label="Authentication mode" data-i18n-aria-label="Authentication mode">
                  <button id="loginTab" type="button" class="active" data-tab="login" data-i18n="Login">Login</button>
                  <button id="registerTab" type="button" data-tab="register" data-i18n="Register">Register</button>
                </div>
              </div>
            </div>

            <div id="loginFormWrap" class="auth-panel-content">
              <form id="loginForm" class="form-grid" novalidate>
                <div class="form-field">
                  <label for="loginEmail" data-i18n="Email">Email</label>
                  <input id="loginEmail" name="email" type="email" placeholder="you@example.com" data-i18n-placeholder="you@example.com" required />
                </div>

                <div class="form-field">
                  <label for="loginPassword" data-i18n="Password">Password</label>
                  <div class="password-input-wrap">
                    <input id="loginPassword" name="password" type="password" placeholder="Enter your password" data-i18n-placeholder="Enter your password" required />
                    <button class="password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password" aria-pressed="false" data-i18n="Show password">Show password</button>
                  </div>
                </div>

                <div class="checkbox-row">
                  <label>
                    <input type="checkbox" name="remember" />
                    <span data-i18n="Remember Me">Remember Me</span>
                  </label>
                  <a id="forgotPasswordLink" href="#loginForm" style="color: var(--accent);" data-i18n="Forgot password?">Forgot password?</a>
                </div>

                <div id="loginError" class="auth-error" aria-live="polite"></div>
                <button type="submit" class="btn btn-primary" data-i18n="Login">Login</button>
              </form>
              <p class="auth-switch"><span data-i18n="Don't have an account?">Don't have an account?</span> <button type="button" class="text-link" data-switch-auth="register" data-i18n="Register now">Register now</button></p>
            </div>

            <div id="registerFormWrap" class="auth-panel-content hidden">
              <form id="registerForm" class="form-grid" novalidate>
                <div class="form-field">
                  <label for="fullName" data-i18n="Full Name">Full Name</label>
                  <input id="fullName" name="name" type="text" placeholder="John Doe" data-i18n-placeholder="John Doe" required />
                </div>

                <div class="form-field">
                  <label for="registerEmail" data-i18n="Email">Email</label>
                  <input id="registerEmail" name="email" type="email" placeholder="you@example.com" data-i18n-placeholder="you@example.com" required />
                </div>

                <div class="inline-row">
                  <div class="form-field">
                    <label for="registerPassword" data-i18n="Password">Password</label>
                    <div class="password-input-wrap">
                      <input id="registerPassword" name="password" type="password" placeholder="Create password" data-i18n-placeholder="Create password" required />
                      <button class="password-toggle" type="button" data-password-toggle="registerPassword" aria-label="Show password" aria-pressed="false" data-i18n="Show password">Show password</button>
                    </div>
                  </div>
                  <div class="form-field">
                    <label for="confirmPassword" data-i18n="Confirm Password">Confirm Password</label>
                    <div class="password-input-wrap">
                      <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat password" data-i18n-placeholder="Repeat password" required />
                      <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show password" aria-pressed="false" data-i18n="Show password">Show password</button>
                    </div>
                  </div>
                </div>

                <div class="form-field">
                  <label for="roleSelect" data-i18n="Role">Role</label>
                  <select id="roleSelect" name="role">
                    <option value="member" data-i18n="Member">Member</option>
                    <option value="trainer" data-i18n="Personal Trainer">Personal Trainer</option>
                  </select>
                </div>

                <div id="registerError" class="auth-error" aria-live="polite"></div>
                <button type="submit" class="btn btn-primary" data-i18n="Create Account">Create Account</button>
              </form>
              <p class="auth-switch"><span data-i18n="Already have an account?">Already have an account?</span> <button type="button" class="text-link" data-switch-auth="login" data-i18n="Login">Login</button></p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div id="authToast" class="toast" aria-live="polite"></div>

    <script src="script.js"></script>
    <script src="cms.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
